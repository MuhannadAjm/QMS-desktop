[package]
name = "qms-license-admin"
version = "1.0.0"
description = "QMS License Admin — License Management Desktop App"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qms_license_admin_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release.build-override]
opt-level = 0
debug = false
codegen-units = 256
incremental = false
overflow-checks = false
